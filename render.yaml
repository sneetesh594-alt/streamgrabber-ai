services:
  - type: web
    name: streamgrabber-ai
    runtime: python
    plan: free
    region: oregon
    buildCommand: ffmpeg -version && ffprobe -version && python -m pip install -r requirements_web.txt
    startCommand: uvicorn stream_downloader.app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/studio/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.14
      - key: CLIPPER_WHISPER_MODEL
        value: tiny
      - key: CLIPPER_AUDIO_BACKEND
        value: pcm
      - key: GEMINI_REVIEW_ENABLED
        value: "false"
      - key: GEMINI_DAILY_REQUEST_LIMIT
        value: "12"
